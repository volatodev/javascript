name: Validate beta CLI candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version to publish (for example 0.1.0-beta.1)
        required: true
        type: string

concurrency:
  group: npm-beta-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate @volatodev/cli candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/assert-beta-release.mjs "$RELEASE_VERSION"

      - name: Read published versions
        run: npm view @volatodev/cli versions --json > "$RUNNER_TEMP/volato-cli-versions.json"

      - name: Enforce immutable version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/assert-beta-release.mjs "$RELEASE_VERSION" "$RUNNER_TEMP/volato-cli-versions.json"

      - name: Run the local release gate
        run: pnpm release:check

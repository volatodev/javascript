name: Publish CLI version

on:
  push:
    branches: [main]
    paths:
      - packages/cli/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-cli-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Gate @volatodev/cli candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      should_publish: ${{ steps.candidate.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve immutable candidate
        id: candidate
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          node scripts/assert-beta-release.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@volatodev/cli@$version" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "@volatodev/cli@$version is already published; publication is immutable."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the local release gate
        if: steps.candidate.outputs.should_publish == 'true'
        run: pnpm release:check

  publish:
    name: Publish @volatodev/cli@${{ needs.candidate.outputs.version }}
    needs: candidate
    if: needs.candidate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Publish with npm trusted publishing
        working-directory: packages/cli
        run: npm publish --tag latest --access public

  canary:
    name: Canary @volatodev/cli@${{ needs.candidate.outputs.version }}
    needs: [candidate, publish]
    if: >-
      ${{
        always() &&
        needs.candidate.result == 'success' &&
        (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VOLATO_CLI_SPEC: "@volatodev/cli@${{ needs.candidate.outputs.version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for the immutable package and latest tag
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            exact=$(npm view "$VOLATO_CLI_SPEC" version 2>/dev/null || true)
            latest=$(npm view @volatodev/cli@latest version 2>/dev/null || true)
            if [ "$exact" = "$RELEASE_VERSION" ] && [ "$latest" = "$RELEASE_VERSION" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "npm did not expose $VOLATO_CLI_SPEC under latest." >&2
          exit 1

      - name: Smoke the public package
        run: node scripts/package-smoke.mjs "$VOLATO_CLI_SPEC"

      - name: Canary Next.js 15 and 16
        run: node scripts/nextjs-conformance.mjs

      - name: Canary long-lived Node.js
        run: node scripts/node-long-lived-conformance.mjs

      - name: Canary Express 4 and 5
        run: node scripts/express-conformance.mjs

      - name: Canary Vite, React, Node.js and Express together
        run: node scripts/vite-node-conformance.mjs
